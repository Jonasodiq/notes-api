# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: salsabil
# "service" is the name of this project. This will also be added to your AWS resource names.
service: notes-api

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-north-1
  iam:
    role: arn:aws:iam::658813353419:role/notes-role
  environment:
    JWT_SECRET: ${env:JWT_SECRET}

functions:
  SignUp:
    handler: functions/signUp/index.handler
    events:
      - httpApi:
          path: /user/signup
          method: POST
  Login:
    handler: functions/login/index.handler
    events:
      - httpApi:
          path: /user/login
          method: POST
  GetNotes:
    handler: functions/getNotes/index.handler
    events:
      - httpApi:
          path: /notes
          method: GET
  CreateNote:
    handler: functions/createNote/index.handler
    events:
      - httpApi:
          path: /notes
          method: POST
  UpdateNote:
    handler: functions/updateNote/index.handler
    events:
      - httpApi:
          path: /notes
          method: PUT
  DeleteNote:
    handler: functions/deleteNote/index.handler
    events:
      - httpApi:
          path: /notes
          method: DELETE
  RestoreNote:
    handler: functions/restoreNote/index.handler
    events:
      - httpApi:
          path: /notes/restore
          method: POST
  GetDeletedNotes:
    handler: functions/getDeletedNotes/index.handler
    events:
      - httpApi:
          path: /notes/deleted
          method: GET
  EmptyTrash:
    handler: functions/emptyTrash/index.handler
    environment:
      TRASH_EXPIRE_DAYS: 1
    events:
      - schedule:
          rate: rate(1 day)
          enabled: true
  ManualEmptyTrash:
    handler: functions/manualEmptyTrash/index.handler
    events:
      - httpApi:
          path: /notes/emptyTrash
          method: POST

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Users
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    NotesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Notes
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
          - AttributeName: deleted
            AttributeType: S
          - AttributeName: deletedAt
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: DeletedIndex
            KeySchema:
              - AttributeName: deleted
                KeyType: HASH
              - AttributeName: deletedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST


